{% extends 'admin/base.html' %}

{% block title %}Admin Profile | Student Cart{% endblock %}

{% block content %}
<section class="admin-page-heading">
    <div><span class="eyebrow">Account settings</span><h1>Admin Profile</h1><p>Update administrator contact details and password.</p></div>
</section>
<section class="panel admin-form-panel">
    <form method="POST" class="admin-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="input-group"><label for="name">Admin name</label><input id="name" name="name" maxlength="100" required value="{{ request.form.get('name', admin.full_name) }}"></div>
        <div class="input-group"><label for="email">Email address</label><input id="email" type="email" name="email" maxlength="254" required value="{{ request.form.get('email', admin.email) }}"></div>
        <div class="input-group"><label for="phone">Phone number</label><input id="phone" type="tel" name="phone" maxlength="20" required value="{{ request.form.get('phone', admin.phone_number) }}"></div>
        <hr>
        <h2>Change password (optional)</h2>
        <div class="input-group"><label for="current_password">Current password</label><input id="current_password" type="password" name="current_password" autocomplete="current-password"></div>
        <div class="admin-form-grid">
            <div class="input-group"><label for="new_password">New password</label><input id="new_password" type="password" name="new_password" minlength="8" autocomplete="new-password"></div>
            <div class="input-group"><label for="confirm_password">Confirm new password</label><input id="confirm_password" type="password" name="confirm_password" minlength="8" autocomplete="new-password"></div>
        </div>
        <div class="admin-form-actions"><button class="primary-btn" type="submit">Save profile</button></div>
    </form>
</section>
{% endblock %}
